name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kage
          POSTGRES_PASSWORD: kage_password
          POSTGRES_DB: kage_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Drizzle migration drift check
        # The schema must be fully described by committed migrations - no
        # `db:push`. A schema change without a migration fails the build.
        run: |
          cd packages/db
          npx drizzle-kit generate --name=ci-drift-check
          cd ../..
          if ! git diff --exit-code -- packages/db/migrations; then
            echo "::error::The schema changed without a migration. Run 'npm run db:generate' and commit the result."
            exit 1
          fi
      - run: npm test
        env:
          DATABASE_URL: postgresql://kage:kage_password@localhost:5432/kage_test
          REDIS_URL: redis://localhost:6379
          AUTH_SECRET: test-auth-secret-min-32-chars-long-here
          ENCRYPTION_KEY: test-encryption-key-min-32-chars
          GOOGLE_CLIENT_ID: test-client-id
          GOOGLE_CLIENT_SECRET: test-client-secret
          OPENAI_API_KEY: test-openai-key
          STRIPE_SECRET_KEY: test-stripe-key
          STRIPE_WEBHOOK_SECRET: test-webhook-secret

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          DATABASE_URL: postgresql://kage:kage_password@localhost:5432/kage_test
          REDIS_URL: redis://localhost:6379
          AUTH_SECRET: test-auth-secret-min-32-chars-long-here
          ENCRYPTION_KEY: test-encryption-key-min-32-chars
          GOOGLE_CLIENT_ID: test-client-id
          GOOGLE_CLIENT_SECRET: test-client-secret
          OPENAI_API_KEY: test-openai-key
          STRIPE_SECRET_KEY: test-stripe-key
          STRIPE_WEBHOOK_SECRET: test-webhook-secret
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the web image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: false
          tags: kage-web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Verify the image runs as a non-root user
        run: |
          uid=$(docker run --rm --entrypoint id kage-web:ci -u)
          if [ "$uid" = "0" ]; then
            echo "ERROR: the image runs as root"; exit 1
          fi
          echo "image runs as uid $uid"